<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  日本語の字形を明示する。

  **fonts-noto-cjk は SC / TC / JP / KR の字形を 1 つに束ねたパッケージ。**
  どの地域の面を使うかを指定しないと、fontconfig は SC（簡体字）の面を選び、
  日本語のページでも中国語の字形で描かれる。漢字は同じ符号位置でも
  地域で形が違うため（「直」「今」「者」など）、**取説に中国語の字形の写しが載る。**

  ⚠️ **豆腐（□）の検査では見つからない。** 字は出ているので lib/tofu.ts は通る。
  だからここで字形を固定する。
-->
<fontconfig>
  <!-- 総称ファミリからの解決。アプリの CSS が sans-serif へ落ちる場合に効く -->
  <match target="pattern">
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK JP</string>
    </edit>
  </match>

  <!-- 言語からの解決。総称ファミリを経由しない指定に効く -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
</fontconfig>
