# 開発環境ひとそろい。
#
# **ホストに .NET SDK も node も DB クライアントも要求しない**ことが目的。
# Pleasanter と 3 種類の RDBMS、本アプリをまとめて起動する。
#
# Pleasanter 側の定義は tools/pleasanter-testenv/docker-compose.yml を include して
# 再利用する（二重管理しないため）。そちらの service 名は db / codedefiner /
# pleasanter / verify。`db` は SQL Server。
#
#   SQL Server で動かす:  docker compose --profile sqlserver up -d --wait
#   PostgreSQL で動かす:  docker compose --profile postgres  up -d --wait
#   MySQL で動かす:       docker compose --profile mysql     up -d --wait
#   ウイルススキャンも:   docker compose --profile postgres --profile clamav up -d --wait
#   後片付け:             docker compose --profile "*" down -v
#
# Pleasanter（db / codedefiner / pleasanter）は profile を持たないので常に起動する。
# **tools/pleasanter-testenv を同時に起動しないこと。** ポートが衝突する。
#
# **Windows の Git Bash からは MSYS_NO_PATHCONV=1 を付けること。**

name: questionnaire-dev

include:
  - path: tools/pleasanter-testenv/docker-compose.yml

services:
  # ---- 3 RDBMS -------------------------------------------------------------
  # SQL Server は include 先の `db` を使う（profile: sqlserver で起動する）

  db-postgres:
    # タグはレジストリで確認して固定する（2026-08-18 時点の最新メジャー）
    image: postgres:18-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_PASSWORD: ${TESTENV_SA_PASSWORD:-Questionnaire#Test1}
      POSTGRES_DB: questionnaire
      TZ: Asia/Tokyo
    ports:
      - "${DEV_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      # **PostgreSQL 18 以降はマウント位置が /var/lib/postgresql。**
      # 従来の /var/lib/postgresql/data へ当てると起動時に弾かれる
      # （pg_upgrade をマウント境界越しに行えないため）
      - postgres-data:/var/lib/postgresql

  db-mysql:
    image: mysql:26
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${TESTENV_SA_PASSWORD:-Questionnaire#Test1}
      MYSQL_DATABASE: questionnaire
      TZ: Asia/Tokyo
    # **utf8mb4 を明示する。** 既定が 3 バイトの utf8 だと絵文字が入らない
    # （_documents/データモデル設計.md 4 章）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
    ports:
      - "${DEV_MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

  # ---- ウイルススキャン（オプション） ---------------------------------------
  # **既定は無効。** profile を付けたときだけ起動する。
  # Azure App Service では**サイドカーコンテナ**として同じ形で動かす
  # （_documents/添付ファイル検査-運用手順書.md）。
  # **ClamAV は GPL-2.0。本アプリのイメージへ同梱しない**（別プロセスとして接続する）
  clamav:
    image: clamav/clamav:1.5-debian13-slim
    profiles: ["clamav"]
    environment:
      TZ: Asia/Tokyo
    ports:
      - "${DEV_CLAMD_PORT:-13310}:3310"
    healthcheck:
      # 定義データベースの取得が終わるまで ready にならない。起動に数分かかる
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s

  # ---- 本アプリ ------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["sqlserver", "postgres", "mysql", "app"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # **Azure の実行環境は既定 UTC。** 明示しないと回答日時が 9 時間ずれる
      # （_documents/実機検証結果.md 4 章）
      TZ: Asia/Tokyo
      # 接続先はプロファイルに応じて .env か環境変数で差し替える
      QUESTIONNAIRE_DB_PROVIDER: ${DEV_DB_PROVIDER:-SqlServer}
      QUESTIONNAIRE_DB_CONNECTIONSTRING: ${DEV_DB_CONNECTIONSTRING:-Server=db;Database=Questionnaire;UID=sa;PWD=Questionnaire#Test1;TrustServerCertificate=True}
      QUESTIONNAIRE_PLEASANTER_BASEURL: http://pleasanter:8080
      # **実値をここへ書かない。** 検証環境用の固定値のみ
      QUESTIONNAIRE_PLEASANTER_APIKEY: ${TESTENV_API_KEY:-6ce6c0fd2f4aea3c093c3ebdd7d4ea3250a132b4867d68e7d1abe35c2499664abb398d74603c2b2a38e31a21319955b3c43ede30394ead7be37ddd615c34e1f6}
      # **管理者の 2 要素の共有鍵を守る鍵。** これを失うと登録済みの 2 要素が全て使えなくなる。
      # 本番では App Service の設定か Key Vault に置き、**控えを取っておくこと**。
      # ここにあるのは検証環境用の固定値
      QUESTIONNAIRE_SECRET_KEY: ${DEV_SECRET_KEY:-4S8dqZ1yq7Xh0mF2vQnQZ6dQ0kGf1o8pM3nR5tU7wYs=}
      # **検証環境だけ緩める。** 端から端まで通す試験が既定の枠（10 回）を使い切るため。
      # **本番では設定しないこと**
      # **端から端まで通す試験は 1 件ごとに管理者を作り直す**（setup ＋ 2 要素の登録）。
      # 試験が増えるほど枠を食うので、検証環境では大きめに取る。**本番では設定しないこと**
      QUESTIONNAIRE_LOGIN_ATTEMPTS_PER_5MIN: ${DEV_LOGIN_ATTEMPTS:-2000}
      QUESTIONNAIRE_REQUESTS_PER_MIN: ${DEV_REQUESTS_PER_MIN:-6000}
      # ウイルススキャンは既定で無効。clamav profile と併せて有効にする
      QUESTIONNAIRE_VIRUSSCAN_ENABLED: ${DEV_VIRUSSCAN_ENABLED:-false}
      QUESTIONNAIRE_VIRUSSCAN_HOST: clamav
      QUESTIONNAIRE_VIRUSSCAN_PORT: "3310"
    ports:
      - "${DEV_APP_PORT:-8081}:8080"
    networks:
      default:
        aliases:
          # **`app` という名前でブラウザから開かない。**
          # Chrome は `.app` を HSTS のプリロード一覧に持っており、
          # 単一ラベルの `app` でも https へ強制されて ERR_SSL_PROTOCOL_ERROR になる
          # （実測。curl では http のまま 200 が返る）
          - questionnaire-app

  # ---- 取説用の写しを撮る ----------------------------------------------------
  # **ホストに Playwright とブラウザを入れない。**
  # **日本語フォントを入れてある**（入れないと文字が豆腐になる）
  #
  # **先に検証環境を起こしておくこと**（app が要る）。
  # app は DB のプロファイル側で定義されているので、ここでは depends_on を書けない。
  #
  #   docker compose --profile sqlserver up -d --wait
  #   docker compose --profile sqlserver --profile screenshots run --rm screenshots
  screenshots:
    build:
      context: ./tools/screenshots
      dockerfile: Dockerfile
    profiles: ["screenshots"]
    environment:
      TZ: Asia/Tokyo
      # コンテナ同士なので、外向けの番号ではなく service 名で繋ぐ
      QUESTIONNAIRE_BASE_URL: http://questionnaire-app:8080
    volumes:
      # 撮った写しと報告書をホストへ出す
      - ./tools/screenshots/shots:/work/shots
      - ./tools/screenshots/report:/work/report

volumes:
  postgres-data:
  mysql-data:
