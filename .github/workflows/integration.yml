# 3 RDBMS（SQL Server / PostgreSQL / MySQL）へ実際に当てる結合テスト。
#
# **1 ジョブにまとめて直列で回す。** 3 つの DB を分けたジョブで並列に回すと、
# 同じテーブルを触るテストが互いの行を消し合う（実際に踏んだ）。xUnit 側でも
# テストクラスの並列実行を止めてある
# （tests/.../Integration.Tests/AssemblyInfo.cs の CollectionBehavior）。
#
# **ここで回さない範囲。** Pleasanter 本体の検証環境（implem/pleasanter ＋ CodeDefiner）と
# 本アプリのコンテナが要るものは外してある。
#   - EndToEndTests / AdminAuthEndToEndTests / PleasanterApiClientTests
#     → **`.github/workflows/e2e.yml` が回す**（根幹ブランチへの push と日次。Issue #111）
#   - scripts/smoke.sh（起動しているアプリへ HTTP で当てるもの）
#     → 手元の `docker compose --profile postgres up -d --wait` で確認する。
#
# **接続先は tests 側にハードコードされている**（localhost の 11433 / 15432 / 13306、
# パスワードは検証用の固定値）。ここでのポート公開はその値に合わせてある。変えると通らない。
#
# 参照した一次情報（いずれも 2026-08-18 参照）
#   - サービスコンテナ（runner 上のジョブからは localhost:<port> で届く）
#     https://docs.github.com/actions/using-containerized-services/about-service-containers
#     https://docs.github.com/en/actions/tutorials/use-containerized-services/create-postgresql-service-containers
#   - job.services.<id>.id でコンテナ ID を取れる
#     https://docs.github.com/en/actions/reference/workflows-and-actions/contexts
#   - イメージのタグはレジストリで実在を確認して固定した（compose.yaml と同じ版）
name: 3 RDBMS 結合テスト

on:
  # 根幹ブランチへの push と、根幹ブランチを対象とする PR
  # （_documents/ブランチ運用方針.md「CI の実行条件」）
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # **検証環境用の固定値。** 本番の資格情報ではない。
  # tests 側の接続文字列に直書きされている値と同じにする必要がある
  TESTENV_SA_PASSWORD: Questionnaire#Test1

jobs:
  integration:
    name: 3 RDBMS 結合テスト
    runs-on: ubuntu-latest

    services:
      # ---- SQL Server ------------------------------------------------------
      # tools/pleasanter-testenv/docker-compose.yml と同じイメージ・同じポート
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Questionnaire#Test1
          MSSQL_PID: Developer
          TZ: Asia/Tokyo
        ports:
          - 11433:1433

      # ---- PostgreSQL ------------------------------------------------------
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: Questionnaire#Test1
          POSTGRES_DB: questionnaire
          # **UTC にしない。** サーバの時間帯が UTC だと、Npgsql の変換事故を
          # 見つける検証（DbTimeTests）が素通りする
          TZ: Asia/Tokyo
        ports:
          - 15432:5432

      # ---- MySQL -----------------------------------------------------------
      # **サービスコンテナは起動コマンドを差し替えられない。**
      # compose.yaml が --character-set-server で指定している文字集合は、
      # 起動後に ALTER DATABASE で合わせる（下のステップ）
      mysql:
        image: mysql:26
        env:
          MYSQL_ROOT_PASSWORD: Questionnaire#Test1
          MYSQL_DATABASE: questionnaire
          TZ: Asia/Tokyo
        ports:
          - 13306:3306

    steps:
      - name: ソースを取得する
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: .NET SDK を用意する
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: DB の起動を待つ
        # **サービスコンテナ側の healthcheck に頼らない。**
        # options へ書くとパスワードの引用が入れ子になって壊れやすいため、
        # ここで docker exec して素直に待つ
        run: |
          set -euo pipefail

          wait_for() {
              local label="$1" tries="$2"
              shift 2
              for i in $(seq 1 "$tries"); do
                  if "$@" >/dev/null 2>&1; then
                      echo "OK   $label（${i} 回目）"
                      return 0
                  fi
                  sleep 5
              done
              echo "NG   $label が起動しない" >&2
              return 1
          }

          wait_for "SQL Server" 60 \
              docker exec ${{ job.services.sqlserver.id }} \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TESTENV_SA_PASSWORD" \
              -C -b -Q "SELECT 1"

          wait_for "PostgreSQL" 60 \
              docker exec ${{ job.services.postgres.id }} pg_isready -U postgres

          wait_for "MySQL" 60 \
              docker exec ${{ job.services.mysql.id }} \
              mysqladmin ping -h 127.0.0.1 -uroot -p"$TESTENV_SA_PASSWORD"

      - name: DB を検証環境と同じ状態にする
        run: |
          set -euo pipefail

          # **SQL Server には Questionnaire データベースが要る。**
          # スキーマの適用（FluentMigrator）はデータベースを作らない
          docker exec ${{ job.services.sqlserver.id }} \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$TESTENV_SA_PASSWORD" -C -b \
              -Q "IF DB_ID('Questionnaire') IS NULL CREATE DATABASE [Questionnaire];"

          # **utf8mb4 を明示する。** 絵文字を含む定義を保存する検証があるため
          # （compose.yaml の --character-set-server / --collation-server と同じ）
          docker exec ${{ job.services.mysql.id }} \
              mysql -uroot -p"$TESTENV_SA_PASSWORD" \
              -e "ALTER DATABASE questionnaire CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_as_cs;"

      - name: 結合テストを実行する
        env:
          # **設定しないと何も検証せずに緑になる。** ここが本ワークフローの肝
          QUESTIONNAIRE_INTEGRATION: "1"
          # 実行環境の時間帯は既定 UTC。検証環境（compose.yaml）に合わせる
          TZ: Asia/Tokyo
        # Pleasanter 本体・本アプリのコンテナが要るものは除く。
        # AdminAuthEndToEndTests も名前に EndToEndTests を含むため、この 2 条件で外れる
        run: >-
          dotnet test tests/VehicleVision.PleasanterTools.Questionnaire.Integration.Tests
          -c Release
          --filter "FullyQualifiedName!~EndToEndTests&FullyQualifiedName!~PleasanterApiClientTests"
          --logger "trx;LogFileName=integration.trx"
          --results-directory "$GITHUB_WORKSPACE/TestResults"

      - name: 起動できるかを確かめる
        # **経路の組み立ては、アプリを本当に起こさないと確かめられない**（Issue #170）。
        # 最小 API は GET / DELETE の本文を推論しないため、
        # 1 本でも本文つきの DELETE があると**経路の組み立てで例外**になり、
        # アプリ全体が起動しない。単体テストも結合テストも経路を組み立てないので、
        # **ここを通さないとマージ後の E2E で初めて分かる。**
        #
        # **結合テストの後に置く。** スキーマが当たっていないと起動時に止まるので、
        # マイグレーションを当てる検証（DatabaseMigrationTests）より後で回す。
        #
        # Pleasanter は要らない（URL とキーは形だけ渡す）。DB は上で起こしたものを使う。
        env:
          QUESTIONNAIRE_DB_PROVIDER: PostgreSql
          QUESTIONNAIRE_DB_CONNECTIONSTRING: >-
            Host=localhost;Port=15432;Database=questionnaire;Username=postgres;Password=Questionnaire#Test1
          # **検証用の DB なので暗号化を求めない。** 本番では外さないこと
          QUESTIONNAIRE_DB_ALLOW_INSECURE: "true"
          QUESTIONNAIRE_PLEASANTER_BASEURL: http://127.0.0.1:9
          QUESTIONNAIRE_PLEASANTER_APIKEY: dummy-api-key
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          set -euo pipefail

          # **共有鍵は使い捨て。** ここで作った鍵は誰にも渡らない
          QUESTIONNAIRE_SECRET_KEY="$(openssl rand -base64 32)"
          export QUESTIONNAIRE_SECRET_KEY

          dotnet build src/VehicleVision.PleasanterTools.Questionnaire.Web -c Release
          dotnet run --project src/VehicleVision.PleasanterTools.Questionnaire.Web \
              -c Release --no-build > "$GITHUB_WORKSPACE/startup.log" 2>&1 &
          app_pid=$!

          # **落ちたらすぐ分かるように、待つ側で生存も見る**
          for i in $(seq 1 30); do
              if ! kill -0 "$app_pid" 2>/dev/null; then
                  echo "NG   アプリが起動せずに終了した" >&2
                  cat "$GITHUB_WORKSPACE/startup.log" >&2
                  exit 1
              fi
              if curl -fsS http://127.0.0.1:5080/healthz >/dev/null 2>&1; then
                  echo "OK   起動して /healthz が応答した（${i} 回目）"
                  kill "$app_pid"
                  exit 0
              fi
              sleep 2
          done

          echo "NG   /healthz が応答しない" >&2
          cat "$GITHUB_WORKSPACE/startup.log" >&2
          kill "$app_pid" || true
          exit 1

      - name: 起動時のログを残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: 起動ログ
          path: startup.log
          if-no-files-found: ignore

      - name: テスト結果を残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 結合テスト結果
          path: TestResults/*.trx
          if-no-files-found: ignore
