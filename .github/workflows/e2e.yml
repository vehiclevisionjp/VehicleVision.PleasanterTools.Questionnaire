# 端から端まで通す試験（Pleasanter 実機を起動する）。
#
# **4 RDBMS 結合テスト（integration.yml）から外してある範囲をここで回す。**
# 「回答を受け付けてから Pleasanter に載るまで」を通しで確かめる唯一の試験が、
# 人が思い出したときに手元で回すだけになっていた（Issue #111）。
#
# **Pleasanter 本体（AGPL v3）は公式イメージを起動するだけ。**
# ソースの参照・コピー・リンク・プロジェクト参照はしない。
# ここで起動するのは「相手方の実機」であって、本製品の一部ではない
# （_reference/README.md と同じ立て付け）。
#
# **コードを触る PR では回す**（Issue #399）。
# ⚠️ **メールが実際に届くかを確かめているのはここだけ。**
# #397（自動返信が 1 通も送れない）は、PR の CI が緑のままマージされ、
# **develop へ入ってから初めて分かった**。#393 の起動確認はアプリが起動するところまでしか見ない。
#
# **以前は「PR ごとには回さない」としていた**（Pleasanter の起動に数分かかるため）。
# ⚠️ **その根拠は実測で崩れた。** 丸ごとで 7〜8 分、Pleasanter を使わないクラスだけに
# 絞ってもテスト本体で 6 分かかる（重いのは起動ではなく、1 件ごとに管理者を作り直す試験本体）。
# **絞ると「PR で回すクラスの一覧」を手で保守することになり、
# 新しく足した試験が PR で回らなくなる**ので、丸ごと回す。
#
# **ドキュメントだけの PR では回さない**（下の paths）。
#
# **Pleasanter の版は固定する**（tools/pleasanter-testenv/docker-compose.yml が
# implem/pleasanter:1.5.7.0 を指す）。最新に追随させると、壊れた原因が
# 自分の変更か相手の更新かを切り分けられなくなる。
name: 端から端まで通す試験

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
    # **振る舞いが変わり得るものだけ。** ドキュメントや Issue テンプレートでは回さない
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "compose.yaml"
      - "Dockerfile"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/e2e.yml"
  schedule:
    # 毎日 03:00 JST（UTC では前日 18:00）。日本の業務時間から外す
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # **検証環境用の固定値。** 本番の資格情報ではない。
  # app と tests の接続文字列で共用する
  TESTENV_SA_PASSWORD: Questionnaire#Test1

jobs:
  e2e-database:
    name: 端から端まで通す試験（${{ matrix.profile }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'schedule' && '["postgres","mysql"]' || '["sqlserver"]') }}
    # Pleasanter の起動と試験本体で、既定の 6 時間は要らないが 30 分では足りない恐れがある
    timeout-minutes: 45

    steps:
      - name: ソースを取得する
        uses: actions/checkout@v7
        with:
          # **Pleasanter のソースは要らない。** 起動するのは公式イメージ
          submodules: false

      - name: .NET SDK を用意する
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 試験対象の RDBMS を設定する
        run: |
          set -euo pipefail
          case "${{ matrix.profile }}" in
              sqlserver)
                  provider=SqlServer
                  connection_string='Server=db;Database=Questionnaire;UID=sa;Password=Questionnaire#Test1;TrustServerCertificate=True'
                  ;;
              postgres)
                  provider=PostgreSql
                  connection_string='Host=db-postgres;Database=questionnaire;Username=postgres;Password=Questionnaire#Test1'
                  ;;
              mysql)
                  provider=MySql
                  connection_string='Server=db-mysql;Database=questionnaire;Uid=root;Password=Questionnaire#Test1'
                  ;;
              *)
                  echo "::error title=Unknown RDBMS profile::${{ matrix.profile }}"
                  exit 1
                  ;;
          esac

          echo "E2E_PROFILE=${{ matrix.profile }}" >> "$GITHUB_ENV"
          echo "DEV_DB_PROVIDER=$provider" >> "$GITHUB_ENV"
          echo "DEV_DB_CONNECTIONSTRING=$connection_string" >> "$GITHUB_ENV"
          echo "QUESTIONNAIRE_E2E_PROVIDER=$provider" >> "$GITHUB_ENV"
          echo "::notice title=E2E database provider::$provider"

      - name: Pleasanter と本アプリを起動する
        # **サービスコンテナを使わない。** CodeDefiner は「走り切って終了する」係で、
        # 常駐を前提とするサービスコンテナには載せられない。compose の
        # depends_on: service_completed_successfully がその順序を持っている。
        #
        # app と HTTP 系試験は Questionnaire、in-process 系試験は
        # Questionnaire_E2E（PostgreSQL / MySQL は questionnaire_e2e）を使う。
        # **同じエンジンでも DB を分け、互いの行を消さない。**
        #
        # **本アプリのイメージはここで組む。** 数分かかるが、
        # 「起動しているアプリへ当てる」試験はこれが無いと成り立たない。
        run: |
          set -euo pipefail
          # **mail プロファイルも起こす**（Issue #189）。自動返信の通しを確かめるため
          # **saml プロファイルも起こす**（Issue #190）。SAML の往復を確かめるため
          DEV_MAIL_ENABLED=true DEV_SAML_ENABLED=true \
            docker compose --profile "$E2E_PROFILE" --profile mail --profile saml up -d --wait

      - name: in-process 試験専用の DB を作る
        run: |
          set -euo pipefail
          case "$E2E_PROFILE" in
              sqlserver)
                  docker compose exec -T db /opt/mssql-tools18/bin/sqlcmd \
                    -S localhost -U sa -P "$TESTENV_SA_PASSWORD" -C -b \
                    -Q "IF DB_ID('Questionnaire_E2E') IS NULL CREATE DATABASE [Questionnaire_E2E];"
                  ;;
              postgres)
                  if ! docker compose exec -T db-postgres \
                    psql -U postgres -d postgres -tAc \
                    "SELECT 1 FROM pg_database WHERE datname = 'questionnaire_e2e'" \
                    | grep -q 1; then
                      docker compose exec -T db-postgres \
                        psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
                        -c "CREATE DATABASE questionnaire_e2e;"
                  fi
                  ;;
              mysql)
                  docker compose exec -T db-mysql sh -c \
                    'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS questionnaire_e2e;"'
                  ;;
          esac

      - name: CodeDefiner が成功したか確かめる
        # **CodeDefiner は失敗しても終了コード 0 を返す**
        # （tools/pleasanter-testenv/README.md）。
        # service_completed_successfully は素通りするので、ログを見るしかない。
        #
        # **全文検索のエラーだけは通す。** SQL Server のコンテナに全文検索が
        # 入っていないために必ず出るが、本アプリは全文検索を使わない
        # （実測。同 README）。**Starter.Main の集計行もこれを数えているだけ**なので
        # 一緒に除く。除いてなお残る `<ERROR>` があれば本当に壊れている
        run: |
          set -euo pipefail
          docker compose logs codedefiner > /tmp/codedefiner.log
          tail -n 40 /tmp/codedefiner.log

          if ! grep -q '<SUCCESS> Starter\.' /tmp/codedefiner.log; then
              echo "::error title=CodeDefiner が完走していない::スキーマの作成が終わっていない。上のログを見ること。"
              exit 1
          fi

          if grep '<ERROR>' /tmp/codedefiner.log \
              | grep -v 'ConfigureFullTextIndexSqlServer' \
              | grep -v 'Starter\.Main: There were'; then
              echo "::error title=CodeDefiner が失敗している::全文検索以外のエラーが出ている。上のログを見ること。"
              exit 1
          fi

          echo "OK   CodeDefiner は完走した（全文検索のエラーは想定内）"

      - name: 検証用の API キーを設定する
        id: pleasanter-api-key
        # Pleasanter は Users.ApiKey をそのまま比較するので、DB へ直接入れれば通る。
        # **キャッシュされた利用者情報を捨てるため、入れた後に再起動する**
        run: |
          set -euo pipefail
          docker compose cp tools/pleasanter-testenv/seed/01_apikey.sql db:/tmp/01_apikey.sql
          docker compose exec -T db /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$TESTENV_SA_PASSWORD" -C -b -i /tmp/01_apikey.sql
          started_at=$(date --iso-8601=ns)
          echo "started-at=$started_at" >> "$GITHUB_OUTPUT"
          docker compose restart pleasanter
          docker compose up -d --wait pleasanter

      - name: Pleasanter と本アプリが応答するか確かめる
        # **待受だけでは足りない。** Kestrel は初期化の途中でも接続を受ける。
        # 試験が使う API が JSON オブジェクトを返すまで待つ。
        env:
          PLEASANTER_STARTED_AT: ${{ steps.pleasanter-api-key.outputs.started-at }}
        run: |
          set -euo pipefail

          wait_for() {
              local label="$1" url="$2"
              for i in $(seq 1 60); do
                  if curl -fsS -o /dev/null "$url"; then
                      echo "OK   $label responded (attempt $i)"
                      return 0
                  fi
                  sleep 5
              done
              echo "NG   $label did not respond" >&2
              return 1
          }

          wait_for_pleasanter_api() {
              local response=/tmp/pleasanter-api-response.json
              for i in $(seq 1 60); do
                  # GetLicenseInfo は API キーで認証し、データを変更せず JSON オブジェクトを返す。
                  if curl -fsS --max-time 10 \
                      -H 'Content-Type: application/json' \
                      -d '{"ApiKey":"6ce6c0fd2f4aea3c093c3ebdd7d4ea3250a132b4867d68e7d1abe35c2499664abb398d74603c2b2a38e31a21319955b3c43ede30394ead7be37ddd615c34e1f6","ApiVersion":1.1}' \
                      -o "$response" \
                      http://localhost:8080/api/utility/GetLicenseInfo \
                      && jq -e 'type == "object"' "$response" > /dev/null; then
                      echo "OK   Pleasanter API returned a JSON object (attempt $i)"
                      return 0
                  fi
                  sleep 5
              done
              echo "NG   Pleasanter API did not return a JSON object" >&2
              return 1
          }

          fail_with_pleasanter_logs() {
              local title="$1" message="$2" log="$3"
              echo "===== Pleasanter logs ====="
              tail -n 100 "$log"
              echo "::error title=$title::$message"
              exit 1
          }
          # **資源が尽きていないかを残す**（Issue #356）。
          # ⚠️ **warmup が落ちる原因はまだ分かっていない。** ランナーの資源不足が候補の 1 つで、
          # **落ちた瞬間の様子を残さないと、次も同じ推測から始めることになる。**
          record_resources() {
              echo "----- resources ($1) -----"
              free -h || true
              df -h / || true
              docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' || true
              echo "--------------------------"
          }

          # **入れ直しは 1 回では足りないことがある**（Issue #356）。
          # ⚠️ **起動の順番や待ち時間には触らない。** 原因が分かっていないので、
          # 先回りして触るとかえって不安定になる（#348 / #351 で確認済み）。
          # **ここでやるのは「駄目なら入れ直す」を厚くすることだけ。**
          attempts=3
          started_from="$PLEASANTER_STARTED_AT"
          log=/tmp/pleasanter-attempt.log
          for attempt in $(seq 1 "$attempts"); do
              api_ready=true
              if ! wait_for_pleasanter_api; then
                  api_ready=false
              fi
              docker compose logs --no-color --since "$started_from" pleasanter > "$log"

              warmup_failed=false
              if grep -q 'Application Warmup Failed' "$log"; then
                  warmup_failed=true
              fi

              if [ "$warmup_failed" = false ] && [ "$api_ready" = true ]; then
                  if [ "$attempt" -gt 1 ]; then
                      # **通ったときも、何回目で通ったかを残す。**
                      # ⚠️ **緑だと記録が残らないと、どれくらい頻発しているか誰も分からない**
                      echo "::warning title=Pleasanter warmup needed a restart::Succeeded on attempt ${attempt} of ${attempts}."
                  fi
                  echo "OK   Pleasanter warmup completed (attempt ${attempt})"
                  break
              fi

              record_resources "attempt ${attempt}"

              if [ "$attempt" -eq "$attempts" ]; then
                  if [ "$warmup_failed" = true ]; then
                      fail_with_pleasanter_logs \
                          "Pleasanter warmup failed" \
                          "Application Warmup Failed was logged on all ${attempts} attempts." \
                          "$log"
                  fi
                  fail_with_pleasanter_logs \
                      "Pleasanter API readiness failed" \
                      "The API did not return a JSON object on all ${attempts} attempts." \
                      "$log"
              fi

              echo "Pleasanter is not ready (attempt ${attempt}). Restarting it."
              started_from=$(date --iso-8601=ns)
              docker compose restart pleasanter
              docker compose up -d --wait pleasanter
          done

          # **Admin*EndToEndTests の当て先**（QUESTIONNAIRE_BASE_URL の既定）
          wait_for "Questionnaire app" http://localhost:8081/healthz

      - name: 端から端まで通す試験を実行する
        env:
          # **設定しないと何も検証せずに緑になる。** ここがこのワークフローの肝
          QUESTIONNAIRE_INTEGRATION: "1"
          # **自動返信メールの通しも確かめる**（Issue #189）。
          # mail プロファイルの Mailpit が受ける。**これも設定しないと素通りする**
          QUESTIONNAIRE_MAIL_INTEGRATION: "1"
          # **SAML の往復も確かめる**（Issue #190）。saml プロファイルの Keycloak が相手。
          # **これも設定しないと素通りする**
          QUESTIONNAIRE_SAML_INTEGRATION: "1"
          # 実行環境の時間帯は既定 UTC。検証環境（compose.yaml）に合わせる
          TZ: Asia/Tokyo
        # integration.yml が除外している分だけを回す（裏返しの条件）
        run: >-
          dotnet test tests/VehicleVision.PleasanterTools.Questionnaire.Integration.Tests
          -c Release
          --filter "FullyQualifiedName~EndToEndTests|FullyQualifiedName~PleasanterApiClientTests"
          --logger "trx;LogFileName=e2e.trx"
          --results-directory "$GITHUB_WORKSPACE/TestResults"

      - name: 失敗したときは容器のログを残す
        if: failure()
        run: |
          echo "::error title=E2E failed ($QUESTIONNAIRE_E2E_PROVIDER)::See this job's logs."
          echo "===== Pleasanter ====="
          docker compose logs --no-color pleasanter | tail -n 100
          echo "===== 本アプリ ====="
          docker compose logs --no-color app | tail -n 100
          echo "===== スキーマの適用 ====="
          docker compose logs --no-color migrate | tail -n 60

      - name: テスト結果を残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: 端から端まで通す試験の結果-${{ matrix.profile }}
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: 後片付け
        if: always()
        run: docker compose --profile '*' down -v --remove-orphans

  e2e:
    name: 端から端まで通す試験
    needs: e2e-database
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: RDBMS ごとの結果をまとめる
        env:
          E2E_DATABASE_RESULT: ${{ needs.e2e-database.result }}
        run: |
          if [ "$E2E_DATABASE_RESULT" != "success" ]; then
              echo "::error title=E2E database job failed::Result: $E2E_DATABASE_RESULT"
              exit 1
          fi
          echo "All E2E database jobs succeeded."

  screenshots:
    name: 写しの一式
    runs-on: ubuntu-latest
    # Pleasanter と本アプリのイメージ作成を含むため、E2E と同じ上限にする
    timeout-minutes: 45

    steps:
      - name: ソースを取得する
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: まっさらな検証環境にする
        # **溜まった行があると Chromium が写しを撮れずに落ちる**（Issue #65）。
        # runner の状態に頼らず、名前付き volume も含めて最初に消す
        run: docker compose --profile sqlserver down -v --remove-orphans

      - name: 写し用のイメージを組み直す
        # spec はイメージへ焼き込まれるため、毎回現在のソースから作る
        run: docker compose --profile screenshots build screenshots

      - name: Pleasanter と本アプリを起動する
        # アプリの変更も現在のソースから検証する
        run: docker compose --profile sqlserver up -d --build --wait

      - name: 写しの一式を実行する
        # 初期設定を先に撮る順序と単発確認用 spec の除外は npm run shot に集約してある
        run: docker compose --profile sqlserver --profile screenshots run --rm screenshots

      - name: 失敗したときは写しの報告書を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: 写しの一式の報告書
          path: tools/screenshots/report
          if-no-files-found: warn

      - name: 後片付け
        if: always()
        run: docker compose --profile '*' down -v --remove-orphans

  notify-failure:
    name: 失敗を Issue で知らせる
    needs:
      - e2e
      - screenshots
    if: >-
      always()
      && (github.event_name == 'push' || github.event_name == 'schedule')
      && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write

    steps:
      - name: 失敗した job と実行 URL を Issue に記録する
        uses: actions/github-script@v9
        with:
          script: |
            const response = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              },
            );
            const failedJobs = response
              .filter((job) => job.conclusion === 'failure')
              .map((job) => `- ${job.name}`)
              .join('\n');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
              + `/actions/runs/${context.runId}`;
            const marker = '<!-- e2e-workflow-failure -->';
            const title = '端から端まで通す試験が失敗している';
            // **行を配列で組む。** テンプレート文字列だと YAML の字下げが本文へ入り、
            // 4 文字以上の字下げとして丸ごとコードブロックに描画される
            const body = [
              marker,
              '## CI の失敗を検出しました',
              '',
              '**失敗した job**',
              '',
              failedJobs,
              '',
              '**実行 URL**',
              '',
              runUrl,
              '',
              '同じ失敗で Issue を重複させないため、この Issue が開いている間は'
                + '最新の失敗内容へ更新します。',
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) =>
              issue.pull_request === undefined && (issue.body ?? '').includes(marker));

            if (existing !== undefined) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

  # **直ったら閉じる**（Issue #401）。
  # ⚠️ **notify-failure は失敗したときしか動かないので、直っても Issue が残り続ける。**
  # 原因を直した PR は「原因の Issue」を Closes するため、**CI が立てた Issue だけが取り残される**
  # （2026-09-23 に #394 がそうなった）。どれが現役の失敗か分からなくなる。
  close-failure-issue:
    name: 直ったことを Issue へ知らせる
    needs:
      - e2e
      - screenshots
    # ⚠️ **push と schedule のときだけ。** notify-failure と同じ条件にそろえる。
    # **PR が通っても develop が直ったとは限らない。**
    # **両方の job が成功したときだけ**閉じる（片方でも落ちていれば閉じない）
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule')
      && needs.e2e.result == 'success'
      && needs.screenshots.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      - name: 開いている失敗の Issue を閉じる
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
              + `/actions/runs/${context.runId}`;
            // ⚠️ **印で探す。** 表題で探すと、人が同じ名前で立てた Issue まで閉じてしまう
            const marker = '<!-- e2e-workflow-failure -->';

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const targets = issues.filter((issue) =>
              issue.pull_request === undefined && (issue.body ?? '').includes(marker));

            for (const issue of targets) {
              // **どの実行で直ったかを残す。** 後から経緯を追えるようにする
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  '## 直ったので閉じます',
                  '',
                  '端から端まで通す試験と写しの一式が、どちらも成功しました。',
                  '',
                  runUrl,
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
