apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "questionnaire.fullname" . }}
  labels:
    {{- include "questionnaire.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
