<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- **検索エンジンに載せない。** 管理画面の入口を晒さない -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- **配置先のサブパス。** サーバが配信時に差し替える（Issue #465、HtmlShell.cs） -->
    <meta name="questionnaire-base-path" content="__QUESTIONNAIRE_BASE_PATH__" />
    <meta name="questionnaire-admin-path" content="__QUESTIONNAIRE_ADMIN_PATH__" />
    <!-- **製品アイコン・ファビコンは DesignReference のもの**（Issue #776）。管理画面だけに付ける。
         回答画面はアンケートの作成者のもので、製品のアイコンを出さない -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/biikurun-icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/biikurun-icon-180.png" />
    <title>アンケート管理</title>
  </head>
  <body>
    <div id="admin"></div>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
